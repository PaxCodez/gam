<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Site</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
#controls{position:fixed;top:10px;right:10px;z-index:9999;background:rgba(0,0,0,.8);padding:10px;border-radius:8px;color:#fff}
select{background:#222;color:#fff;border:1px solid #555;padding:7px;border-radius:5px;font-size:14px;cursor:pointer}
#message{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#777;font-size:18px;text-align:center;width:90%;line-height:1.5}
</style>
</head>
<body>
<div id="controls">
<label for="mirror">CDN:</label>
<select id="mirror">
<option value="" disabled selected>Select CDN...</option>
<option value="https://unpkg.com">UNPKG</option>
<option value="https://cdn.jsdelivr.net">jsDelivr</option>
<option value="https://fastly.jsdelivr.net">Fastly jsDelivr</option>
</select>
</div>
<div id="message">
Select a CDN from the top-right to launch the game.
</div>
<script>
const gamePath="/gh/s0n-1m-cr1n3/sc13nc3/assets/index.html";
const selector=document.getElementById("mirror");

selector.addEventListener("change",async function(){
const mirror=this.value;
if(!mirror)return;

const tab=window.open("about:blank","_blank");

try{

let url;

if(mirror==="https://unpkg.com"){
document.getElementById("message").textContent=
"UNPKG uses npm packages, so this game must exist as an npm package.";
tab.document.write(
"<div style='font-family:sans-serif;padding:20px'>" +
"<h2>UNPKG selected</h2>" +
"<p>The original game is hosted through a GitHub/jsDelivr path.</p>" +
"<p>UNPKG cannot directly load arbitrary GitHub files.</p>" +
"</div>"
);
tab.document.close();
}else{

url=mirror+gamePath+"?t="+Date.now();

const response=await fetch(url);

if(!response.ok){
throw new Error("HTTP "+response.status);
}

const html=await response.text();

tab.document.open();
tab.document.write(html);
tab.document.close();

}

}catch(error){

tab.document.open();
tab.document.write(
"<div style='font-family:sans-serif;padding:20px'>" +
"<h2>Failed to load game</h2>" +
"<p>Try another CDN mirror.</p>" +
"</div>"
);
tab.document.close();

}

this.value="";
});
</script>
</body>
</html>
